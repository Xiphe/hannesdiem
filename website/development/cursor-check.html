<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />
  <title>Local cursor check</title>
  <style>
    body {
      max-width: 50rem;
      margin: 4rem auto;
      padding: 0 2rem;
      font:
        18px/1.6 system-ui,
        sans-serif;
      color: #ddd;
      background: #080808;
    }
    section {
      margin: 2rem 0;
      padding: 1rem;
      border: 1px solid #555;
    }
    a {
      color: #9dc4ff;
    }
    button,
    input {
      padding: 0.75rem;
      font: inherit;
    }
    button {
      cursor: pointer;
    }
  </style>
  <h1>Local cursor check</h1>
  <p>
    This static page has no media, canvas, animation, application styles or scripts. Move across
    each control to compare the cursor with the Temple header.
  </p>
  <section>
    <a
      href="#native-link"
      id="native-link"
      >Native link — hand cursor</a
    >
  </section>
  <section><button type="button">Native button — hand cursor</button></section>
  <section>
    <label>Text field — text cursor <input type="text" /></label>
  </section>
  <p><a href="/temple-of-sound/visit">Return to the Temple</a></p>
</html>
