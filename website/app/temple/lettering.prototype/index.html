<!doctype html>
<html
  lang="en"
  data-fill="photo"
>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <meta
      name="robots"
      content="noindex"
    />
    <title>Temple of Sound — lettering comparison</title>
    <link
      rel="stylesheet"
      href="/style.css"
    />
    <script
      type="module"
      src="/preview.js"
    ></script>
  </head>
  <body>
    <main aria-label="Title lettering specimens"></main>
    <nav aria-label="Comparison controls">
      <button
        type="button"
        id="overview"
        aria-label="Show all specimens"
        title="Show all (Escape)"
      >
        ▦
      </button>
      <button
        type="button"
        id="previous"
        aria-label="Previous typeface"
        title="Previous (Left arrow)"
      >
        ←
      </button>
      <select
        id="typeface"
        aria-label="Typeface"
      ></select>
      <button
        type="button"
        id="next"
        aria-label="Next typeface"
        title="Next (Right arrow)"
      >
        →
      </button>
      <button
        type="button"
        id="fill"
        aria-label="Show solid lettering"
        title="Photograph / solid lettering"
        aria-pressed="false"
      >
        ◐
      </button>
    </nav>
  </body>
</html>
