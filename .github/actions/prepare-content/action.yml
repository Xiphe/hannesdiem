name: Prepare content
description: Compile a complete CMX publication and reuse processed immutable media.
runs:
  using: composite
  steps:
    - shell: bash
      run: npm run cmx:build
    - name: Restore processed media
      id: media
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        key: media-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MEDIA_BASE_URL }}-${{ hashFiles('content/media/**', 'content/media.json', 'content/palettes.json', '.generated/routes.json', 'scripts/build-media.ts', 'scripts/build-og.ts', 'scripts/extract-palettes.ts', 'tools/palette/package.json', 'tools/palette/package-lock.json', 'package-lock.json') }}
        path: |
          .generated/media/
          .generated/media.json
          .generated/media-files.json
          .generated/og.json
          .generated/palettes.json
    - name: Install palette processor (Actions only)
      if: steps.media.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --prefix tools/palette
    - name: Extract image metadata
      if: steps.media.outputs.cache-hit != 'true'
      shell: bash
      run: node scripts/extract-palettes.ts
    - name: Build media
      if: steps.media.outputs.cache-hit != 'true'
      shell: bash
      run: npm run media:build
    - name: Cache processed media
      if: steps.media.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        key: ${{ steps.media.outputs.cache-primary-key }}
        path: |
          .generated/media/
          .generated/media.json
          .generated/media-files.json
          .generated/og.json
          .generated/palettes.json
    - name: Save palette metadata for local previews
      if: steps.media.outputs.cache-hit != 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: media-palettes-${{ github.job }}
        path: .generated/palettes.json
        include-hidden-files: true
    - shell: bash
      run: node scripts/build-publication.ts
