name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-main
  cancel-in-progress: false

jobs:
  changes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Pending runs can be superseded. Include changes since the last deployment,
    # rather than only the immediately preceding push.
    outputs:
      website: ${{ steps.baseline.outputs.all == 'true' || steps.paths.outputs.website == 'true' || steps.paths.outputs.shared == 'true' }}
      content: ${{ steps.baseline.outputs.all == 'true' || steps.paths.outputs.content == 'true' || steps.paths.outputs.shared == 'true' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: .github
      - name: Find the last successful deployment
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          baseline=$(gh api "repos/$GH_REPO/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || -z "$baseline" ]] || ! git merge-base --is-ancestor "$baseline" "$GITHUB_SHA"; then
            echo 'all=true' >> "$GITHUB_OUTPUT"
          else
            echo "sha=$baseline" >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: paths
        if: steps.baseline.outputs.all != 'true'
        with:
          base: ${{ steps.baseline.outputs.sha }}
          ref: ${{ github.sha }}
          filters: |
            website:
              - 'website/**'
            content:
              - 'content/**'
              - '.gitattributes'
            shared:
              - 'contracts/**'
              - 'package*.json'
              - 'tsconfig.json'
              - 'dev.ts'
              - '.prettier*'
              - '.github/workflows/**'

  website:
    name: Deploy website
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            website
            contracts
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:app
      - run: npm run check:website
      - name: Check compatibility with the published CMS interface
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node --import remix/node-tsx website/build/check-content-host.ts
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure Production environment secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Checks passed; deployment has not run."
            exit 1
          fi
      - name: Deploy
        id: deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.jsonl
          CMX_PUBLISH_PUBLIC_KEYS: ${{ vars.CMX_PUBLISH_PUBLIC_KEYS }}
          NEWSLETTER_SESSION_SECRET: ${{ secrets.NEWSLETTER_SESSION_SECRET }}
          RESEND_HANNESDIEM_DE_API_KEY: ${{ secrets.RESEND_HANNESDIEM_DE_API_KEY }}
          RESEND_HANNESDIEM_DE_SEGMENT_ID: ${{ vars.RESEND_HANNESDIEM_DE_SEGMENT_ID }}
          RESEND_CIRCLE_WEBHOOK_SECRET: ${{ secrets.RESEND_CIRCLE_WEBHOOK_SECRET }}
        run: |
          if [[ -n "$NEWSLETTER_SESSION_SECRET" && -n "$RESEND_HANNESDIEM_DE_API_KEY" && -n "$RESEND_HANNESDIEM_DE_SEGMENT_ID" ]]; then
            node website/build/verify-newsletter.ts
            secrets_file="$RUNNER_TEMP/newsletter-secrets.json"
            node -e 'const names = ["NEWSLETTER_SESSION_SECRET", "RESEND_HANNESDIEM_DE_API_KEY", "RESEND_CIRCLE_WEBHOOK_SECRET"]; require("node:fs").writeFileSync(process.argv[1], JSON.stringify(Object.fromEntries(names.filter(name => process.env[name]).map(name => [name, process.env[name]]))), {mode:0o600})' "$secrets_file"
            trap 'rm -f "$secrets_file"' EXIT
            npm run deploy -- --var "CMX_PUBLISH_PUBLIC_KEYS:$CMX_PUBLISH_PUBLIC_KEYS" --secrets-file "$secrets_file" --var "RESEND_HANNESDIEM_DE_SEGMENT_ID:$RESEND_HANNESDIEM_DE_SEGMENT_ID"
            if [[ -z "$RESEND_CIRCLE_WEBHOOK_SECRET" ]]; then
              echo 'Circle external unsubscribe synchronization uses periodic reconciliation until its Resend webhook signing secret is configured.' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            npm run deploy -- --var "CMX_PUBLISH_PUBLIC_KEYS:$CMX_PUBLISH_PUBLIC_KEYS"
            echo 'Newsletter disabled until its Production secrets and segment variable are configured.' >> "$GITHUB_STEP_SUMMARY"
          fi
          deployment_url=$(jq -ers '[.[] | select(.type == "deploy") | .targets[]? | select(startswith("https://"))][0] // error("Wrangler returned no deployment URL")' "$WRANGLER_OUTPUT_FILE_PATH")
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          printf 'Deployed: [%s](%s)\n' "$deployment_url" "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Check deployed Worker health
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
        run: node --input-type=module -e 'const r = await fetch(new URL("/health", process.env.DEPLOYMENT_URL), {signal:AbortSignal.timeout(20000)}); if (!r.ok || !(await r.json()).ok) process.exit(1)'
      - name: Record deferred QA
        run: echo 'Deployment passed fast checks. Browser QA is separate; run the manual QA workflow or npm run test:qa against the deployed site.' >> "$GITHUB_STEP_SUMMARY"

  content:
    name: Publish content
    needs: [changes, website]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' &&
          needs.changes.outputs.content == 'true' &&
          (needs.website.result == 'success' || needs.website.result == 'skipped') }}
    uses: ./.github/workflows/content.yml
    secrets: inherit
