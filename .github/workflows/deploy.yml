name: Check and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: Production
    env:
      MEDIA_BASE_URL: https://media.hannesdiem.de
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore processed media
        id: media
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: media-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MEDIA_BASE_URL }}-${{ hashFiles('content/media/**', 'content/media.json', 'content/palettes.json', 'content/routes.json', 'scripts/build-media.ts', 'scripts/build-og.ts', 'scripts/extract-palettes.ts', 'tools/palette/package.json', 'tools/palette/package-lock.json', 'package-lock.json') }}
          path: |
            .generated/media/
            .generated/media.json
            .generated/media-files.json
            .generated/og.json
            .generated/palettes.json
      - name: Install palette processor (Actions only)
        if: steps.media.outputs.cache-hit != 'true'
        run: npm ci --prefix tools/palette
      - name: Extract image metadata
        if: steps.media.outputs.cache-hit != 'true'
        run: node scripts/extract-palettes.ts
      - name: Build media
        if: steps.media.outputs.cache-hit != 'true'
        run: npm run media:build
      - name: Cache processed media
        if: steps.media.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.media.outputs.cache-primary-key }}
          path: |
            .generated/media/
            .generated/media.json
            .generated/media-files.json
            .generated/og.json
            .generated/palettes.json
      - name: Save palette metadata for local previews
        if: steps.media.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: media-palettes
          path: .generated/palettes.json
          include-hidden-files: true
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run build:app
      - run: npm run check
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure Production environment secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; see README.md. Checks passed; deployment has not run."
            exit 1
          fi
          if [[ -z "$R2_ACCOUNT_ID" || -z "$R2_ACCESS_KEY_ID" || -z "$R2_SECRET_ACCESS_KEY" ]]; then
            echo "::error::Configure Production variable R2_ACCOUNT_ID and secrets R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY; see README.md."
            exit 1
          fi
      - name: Upload content media to R2
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: npm run media:upload
      - name: Deploy
        id: deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.jsonl
          NEWSLETTER_SESSION_SECRET: ${{ secrets.NEWSLETTER_SESSION_SECRET }}
          RESEND_HANNESDIEM_DE_API_KEY: ${{ secrets.RESEND_HANNESDIEM_DE_API_KEY }}
          RESEND_HANNESDIEM_DE_SEGMENT_ID: ${{ vars.RESEND_HANNESDIEM_DE_SEGMENT_ID }}
        run: |
          if [[ -n "$NEWSLETTER_SESSION_SECRET" && -n "$RESEND_HANNESDIEM_DE_API_KEY" && -n "$RESEND_HANNESDIEM_DE_SEGMENT_ID" ]]; then
            node scripts/verify-newsletter.ts
            secrets_file="$RUNNER_TEMP/newsletter-secrets.json"
            node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({NEWSLETTER_SESSION_SECRET:process.env.NEWSLETTER_SESSION_SECRET,RESEND_HANNESDIEM_DE_API_KEY:process.env.RESEND_HANNESDIEM_DE_API_KEY}), {mode:0o600})' "$secrets_file"
            trap 'rm -f "$secrets_file"' EXIT
            npm run deploy -- --secrets-file "$secrets_file" --var "RESEND_HANNESDIEM_DE_SEGMENT_ID:$RESEND_HANNESDIEM_DE_SEGMENT_ID"
          else
            npm run deploy
            echo 'Newsletter disabled until its Production secrets and segment variable are configured; see docs/newsletter.md.' >> "$GITHUB_STEP_SUMMARY"
          fi
          deployment_url=$(jq -ers '[.[] | select(.type == "deploy") | .targets[]? | select(startswith("https://"))][0] // error("Wrangler returned no deployment URL")' "$WRANGLER_OUTPUT_FILE_PATH")
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          printf 'Deployed: [%s](%s)\n' "$deployment_url" "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
        run: node scripts/smoke.ts "$DEPLOYMENT_URL"
